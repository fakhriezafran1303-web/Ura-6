<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ura-6 - Lost in Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background:
                radial-gradient(ellipse at 20% 10%, #1b1035 0%, transparent 50%),
                radial-gradient(ellipse at 80% 90%, #0a2540 0%, transparent 55%),
                #05060a;
            color: #c5c6c7;
            font-family: 'Courier Prime', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== LATAR KOSMIK ===== */
        #cosmic-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.2;
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.12; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.4); } }

        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.3;
            animation: drift 14s ease-in-out infinite alternate;
        }
        .nebula.n1 { width: 380px; height: 380px; left: -100px; bottom: -80px; background: #6f42c1; }
        .nebula.n2 { width: 320px; height: 320px; right: -80px; top: -60px; background: #0e7c86; animation-delay: -6s; }
        @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(40px, 25px) scale(1.2); } }

        .deco-planet {
            position: absolute;
            right: -70px;
            bottom: -70px;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #7d3cff, #2b1a5e 55%, #0b0c10 95%);
            box-shadow: inset -25px -25px 50px rgba(0,0,0,0.85), 0 0 60px rgba(125, 60, 255, 0.35);
            opacity: 0.8;
            animation: float 9s ease-in-out infinite;
        }
        .deco-planet::after {
            content: '';
            position: absolute;
            width: 380px;
            height: 50px;
            border: 5px solid rgba(197, 198, 199, 0.2);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
        }
        .deco-moon {
            position: absolute;
            left: 6%;
            bottom: 12%;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #e0e0e0, #7f8c8d 60%, #1f2833 100%);
            box-shadow: inset -8px -8px 14px rgba(0,0,0,0.8), 0 0 14px rgba(197,198,199,0.25);
            animation: float 7s ease-in-out infinite;
            animation-delay: -3s;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        .shooting-star {
            position: absolute;
            top: -10px;
            left: var(--x);
            width: 2px;
            height: 90px;
            background: linear-gradient(to bottom, rgba(102, 252, 241, 0), #fff);
            opacity: 0;
            animation: shoot 9s linear infinite;
            animation-delay: var(--d);
        }
        @keyframes shoot {
            0% { opacity: 0; transform: translate(0, 0) rotate(45deg); }
            2% { opacity: 1; }
            10% { opacity: 0; transform: translate(-450px, 450px) rotate(45deg); }
            100% { opacity: 0; transform: translate(-450px, 450px) rotate(45deg); }
        }

        #cosmic-caption {
            position: absolute;
            bottom: 6px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Special Elite', cursive;
            font-size: 11px;
            letter-spacing: 3px;
            color: rgba(102, 252, 241, 0.45);
            animation: blink-soft 4s ease-in-out infinite;
        }
        @keyframes blink-soft { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }

        /* ===== BLACKHOLE & WATERMARK ===== */
        #page-blackhole {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #000 30%, #1f2833 65%, #66fcf1 100%);
            box-shadow: 0 0 35px rgba(102, 252, 241, 0.5), inset 0 0 30px #000;
            animation: spin-bh 8s linear infinite;
            z-index: 50;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed rgba(102, 252, 241, 0.4);
        }
        #page-blackhole::before {
            content: '';
            position: absolute;
            width: 150px;
            height: 40px;
            border: 1px solid rgba(197, 198, 199, 0.3);
            border-radius: 50%;
            transform: rotate(-20deg);
        }
        @keyframes spin-bh { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #dev-watermark {
            position: fixed;
            top: 15px;
            right: 20px;
            font-size: 13px;
            letter-spacing: 2px;
            color: rgba(102, 252, 241, 0.7);
            z-index: 50;
            pointer-events: none;
            font-family: 'Special Elite', cursive;
        }

        #game-container {
            position: relative;
            z-index: 1;
            box-shadow: 0 0 30px rgba(31, 40, 51, 0.8);
            border: 2px solid #1f2833;
            border-radius: 6px;
            overflow: hidden;
            background: #0b0c10;
            max-width: 100%;
            animation: frame-glow 5s ease-in-out infinite alternate;
        }
        @keyframes frame-glow {
            from { box-shadow: 0 0 22px rgba(102, 252, 241, 0.15); }
            to { box-shadow: 0 0 48px rgba(125, 60, 255, 0.4); }
        }

        #game-container.fullscreen-mode {
            width: 100vw !important;
            height: 100vh !important;
            border: none;
            border-radius: 0;
            box-shadow: none;
            animation: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 999;
        }
        #game-container.fullscreen-mode canvas {
            width: 100% !important;
            height: 100% !important;
        }

        canvas {
            background:
                radial-gradient(circle at 30% 30%, rgba(111, 66, 193, 0.18), transparent 50%),
                radial-gradient(circle at center, #1f2833 0%, #0b0c10 100%);
            display: block;
            max-width: 100%;
            height: auto;
        }
        .ui-panel {
            position: absolute;
            top: 12px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
            z-index: 5;
            padding-left: 140px;
        }

        #buff-indicator {
            position: absolute;
            top: 36px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px currentColor;
            pointer-events: none;
            z-index: 5;
            display: none;
        }

        .energy-bar-container {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            height: 12px;
            background: rgba(11, 12, 16, 0.85);
            border: 1px solid #ffb347;
            border-radius: 3px;
            overflow: hidden;
            z-index: 6;
            pointer-events: none;
        }
        #energy-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #e67e22, #f1c40f);
            transition: width 0.1s linear;
        }
        .energy-label {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: bold;
            color: #ffb347;
            letter-spacing: 1.5px;
            z-index: 6;
            pointer-events: none;
        }

        .shield-label {
            position: absolute;
            bottom: 22px;
            left: calc(50% + 140px);
            font-size: 11px;
            font-weight: bold;
            color: #5dade2;
            letter-spacing: 1.5px;
            z-index: 6;
            pointer-events: none;
        }
        .shield-bar-container {
            position: absolute;
            bottom: 8px;
            left: calc(50% + 140px);
            width: 100px;
            height: 12px;
            background: rgba(11, 12, 16, 0.85);
            border: 1px solid #5dade2;
            border-radius: 3px;
            overflow: hidden;
            z-index: 6;
            pointer-events: none;
        }
        #shield-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #2980b9, #5dade2);
        }

        #top-options {
            position: absolute;
            top: 8px;
            left: 12px;
            display: flex;
            gap: 6px;
            z-index: 20;
        }
        .opt-btn {
            background: rgba(31, 40, 51, 0.8);
            border: 1px solid #45a29e;
            color: #66fcf1;
            padding: 4px 10px;
            font-size: 13px;
            border-radius: 3px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Courier Prime', Courier, monospace;
        }
        .opt-btn:hover {
            background: #45a29e;
            color: #0b0c10;
        }
        .opt-btn:active { transform: scale(0.92); }

        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background:
                radial-gradient(circle at 15% 20%, rgba(111, 66, 193, 0.28), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(0, 180, 216, 0.2), transparent 50%),
                radial-gradient(circle at center, rgba(11, 12, 16, 0.96), rgba(5, 6, 8, 0.99));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        .planet-bg {
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #c5c6c7, #45a29e 60%, #1f2833 90%);
            box-shadow: inset -15px -15px 30px rgba(0,0,0,0.9), 0 0 30px rgba(69, 162, 158, 0.2);
            z-index: -2;
            opacity: 0.75;
            animation: float 6s ease-in-out infinite;
        }
        .saturn-ring {
            position: absolute;
            width: 260px;
            height: 35px;
            border: 4px solid rgba(197, 198, 199, 0.3);
            border-radius: 50%;
            transform: rotate(-20deg);
            z-index: -2;
        }

        .solar-orbit {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 1px dotted rgba(102, 252, 241, 0.2);
            border-radius: 50%;
            z-index: -3;
            animation: spin 40s linear infinite;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .moon {
            position: absolute;
            border-radius: 50%;
            background: #c5c6c7;
            box-shadow: 0 0 6px rgba(255,255,255,0.4);
            z-index: -1;
            animation: orbit linear infinite;
        }
        #phobos { width: 9px; height: 9px; animation-duration: 9s; background: #c0392b; }
        #europa { width: 11px; height: 11px; animation-duration: 15s; background: #e67e22; }
        #titan { width: 13px; height: 13px; animation-duration: 22s; background: #d35400; }
        #venus-moon { width: 8px; height: 8px; animation-duration: 12s; background: #95a5a6; }

        @keyframes orbit {
            from { transform: rotate(0deg) translateX(150px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(150px) rotate(-360deg); }
        }

        .title-glow {
            font-family: 'Special Elite', cursive;
            color: #66fcf1;
            font-size: 26px;
            letter-spacing: 3px;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.5), 0 0 24px rgba(125, 60, 255, 0.4);
            white-space: pre-line;
            line-height: 1.3;
            animation: title-flicker 5s infinite;
        }
        @keyframes title-flicker {
            0%, 90%, 100% { opacity: 1; }
            92% { opacity: 0.55; }
            94% { opacity: 1; }
            96% { opacity: 0.7; }
        }

        .settings-box {
            background: rgba(31, 40, 51, 0.7);
            border: 1px solid #45a29e;
            padding: 10px 16px;
            border-radius: 5px;
            margin-bottom: 12px;
            width: 85%;
            max-width: 420px;
        }
        .setting-group {
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        select, input[type="range"] {
            background: #0b0c10;
            color: #66fcf1;
            border: 1px solid #45a29e;
            padding: 3px 6px;
            border-radius: 3px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            font-family: 'Courier Prime', Courier, monospace;
            font-size: 12px;
        }

        p.story-text {
            margin-bottom: 12px;
            max-width: 85%;
            line-height: 1.4;
            color: #c5c6c7;
            font-size: 12px;
            background: rgba(31, 40, 51, 0.5);
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #45a29e;
        }

        /* ===== PILIHAN BAHASA (DI OVERLAY WELCOME) ===== */
        .lang-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .lang-btn {
            background: rgba(31, 40, 51, 0.8);
            border: 1px solid #45a29e;
            color: #66fcf1;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            font-family: 'Courier Prime', Courier, monospace;
        }
        .lang-btn.active {
            background: #66fcf1;
            color: #05060a;
            box-shadow: 0 0 14px #66fcf1;
        }
        .lang-btn:active { transform: scale(0.92); }

        /* ===== TOMBOL UTAMA ===== */
        .blackhole-btn {
            position: relative;
            overflow: hidden;
            min-width: 170px;
            height: 54px;
            padding: 0 28px;
            border-radius: 40px;
            background: linear-gradient(135deg, #45a29e, #66fcf1);
            border: 2px solid #c5fffb;
            color: #05060a;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 2px;
            font-family: 'Special Elite', cursive;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            touch-action: manipulation;
            transition: transform 0.2s, filter 0.2s;
            animation: btn-pulse 2s ease-in-out infinite;
        }
        .blackhole-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -80%;
            width: 50%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transform: skewX(-20deg);
            animation: btn-shine 3s ease-in-out infinite;
        }
        @keyframes btn-shine { 0% { left: -80%; } 60%, 100% { left: 140%; } }
        @keyframes btn-pulse {
            0%, 100% { box-shadow: 0 0 12px rgba(102, 252, 241, 0.5), 0 0 0 0 rgba(102, 252, 241, 0.55); }
            50% { box-shadow: 0 0 26px rgba(102, 252, 241, 0.95), 0 0 0 12px rgba(102, 252, 241, 0); }
        }
        .blackhole-btn:hover {
            transform: scale(1.08);
            filter: brightness(1.15);
        }
        .blackhole-btn:active {
            transform: scale(0.93);
            filter: brightness(0.9);
        }

        .mode-btn-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 85%;
            max-width: 380px;
            margin-bottom: 12px;
        }
        .mode-btn {
            background: rgba(31, 40, 51, 0.6);
            border: 1px solid #45a29e;
            color: #66fcf1;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            font-family: 'Courier Prime', Courier, monospace;
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
        }
        .mode-btn:hover {
            background: #45a29e;
            color: #0b0c10;
        }
        .mode-btn:active { transform: scale(0.94); }
        .mode-btn.beginner {
            grid-column: 1 / -1;
            border-color: #7dff9b;
            color: #7dff9b;
            background: rgba(46, 204, 113, 0.14);
        }
        .mode-btn.beginner:hover {
            background: #2ecc71;
            color: #05060a;
        }
        .mode-btn.crazy {
            border-color: #c0392b;
            color: #e74c3c;
            background: rgba(192, 57, 43, 0.2);
        }
        .mode-btn.crazy:hover {
            background: #c0392b;
            color: #fff;
        }
        .mode-btn.selected {
            border-color: #66fcf1;
            background: rgba(102, 252, 241, 0.2);
            box-shadow: 0 0 16px #66fcf1;
            transform: scale(1.05);
        }

        .controls-hint {
            margin-top: 10px;
            font-size: 11px;
            color: #f39c12;
            line-height: 1.3;
        }

        #dpad-container {
            position: absolute;
            bottom: 25px;
            left: 25px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 6;
        }
        .dbtn {
            width: 100px;
            height: 85px;
            background: rgba(31, 40, 51, 0.85);
            border: 2px solid #66fcf1;
            color: #66fcf1;
            border-radius: 16px;
            font-weight: bold;
            font-size: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 0 18px rgba(102, 252, 241, 0.5);
        }
        .dbtn:active { background: #66fcf1; color: #0b0c10; }

        #fire-btn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #c0392b 0%, #78281f 100%);
            border: 3px solid #e74c3c;
            color: white;
            font-weight: bold;
            font-size: 20px;
            font-family: 'Special Elite', cursive;
            box-shadow: 0 0 25px rgba(192, 57, 43, 0.8);
            cursor: pointer;
            z-index: 6;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #fire-btn:active { transform: scale(0.92); }

        #flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.1s ease-out;
        }
    </style>
</head>
<body>

    <div id="cosmic-bg">
        <div class="nebula n1"></div>
        <div class="nebula n2"></div>
        <div class="deco-planet"></div>
        <div class="deco-moon"></div>
        <div class="shooting-star" style="--x: 85%; --d: 1s;"></div>
        <div class="shooting-star" style="--x: 60%; --d: 4.5s;"></div>
        <div class="shooting-star" style="--x: 95%; --d: 7s;"></div>
        <div id="cosmic-caption" data-i18n="caption">◈ UNKNOWN SIGNAL DETECTED IN SECTOR URA-6 ◈</div>
    </div>

    <div id="page-blackhole" title="Cosmic Anomaly"></div>
    <div id="dev-watermark">DEV: ONLY 1</div>

<div id="game-container">
    <canvas id="gameCanvas" width="850" height="500"></canvas>
    <div id="flash-overlay"></div>
    
    <div id="top-options">
        <button class="opt-btn" onclick="restartGame()" data-i18n="restart">RESTART</button>
        <button class="opt-btn" onclick="exitGame()" data-i18n="exit">EXIT</button>
    </div>

    <div class="ui-panel">
        <div><span data-i18n="score">SCORE:</span> <span id="scoreDisplay" style="color: #66fcf1;">0</span></div>
        <div><span data-i18n="level">LEVEL:</span> <span id="levelDisplay" style="color: #45a29e;">1</span></div>
        <div><span data-i18n="wave">WAVE:</span> <span id="waveDisplay" style="color: #f39c12;">1/3</span></div>
        <div><span data-i18n="dmg">DMG:</span> <span id="damageDisplay" style="color: #c5c6c7;">10</span></div>
        <div><span data-i18n="hp">HP:</span> <span id="hpDisplay" style="color: #2ecc71;">200</span></div>
    </div>

    <div id="buff-indicator"></div>

    <div class="energy-label" data-i18n="bombLabel">BIG BOMBA</div>
    <div class="energy-bar-container">
        <div id="energy-fill"></div>
    </div>

    <div class="shield-label" data-i18n="shieldLabel">SHIELD</div>
    <div class="shield-bar-container"><div id="shield-fill"></div></div>

    <div id="dpad-container">
        <button class="dbtn" id="btn-up">▲</button>
        <button class="dbtn" id="btn-down">▼</button>
    </div>
    <button id="fire-btn">FIRE</button>

    <!-- STEP 1: WELCOME (SELALU MULAI DALAM BAHASA INGGRIS) -->
    <div id="welcomeOverlay" class="overlay-screen">
        <div class="planet-bg"></div>
        <div class="saturn-ring"></div>
        <div class="moon" id="phobos" style="animation-delay: 0s;"></div>
        <div class="moon" id="europa" style="animation-delay: -3s;"></div>
        <div class="moon" id="titan" style="animation-delay: -6s;"></div>
        <div class="moon" id="venus-moon" style="animation-delay: -9s;"></div>

        <h1 class="title-glow" id="mainTitle">WELCOME</h1>
        <p class="story-text" id="mainDesc"></p>

        <div class="lang-row">
            <button class="lang-btn active" id="langBtnEn" onclick="setLang('en')">🇬🇧 English</button>
            <button class="lang-btn" id="langBtnId" onclick="setLang('id')">🇮🇩 Indonesia</button>
        </div>

        <button class="blackhole-btn" id="startBtn" onclick="proceedToUra()" data-i18n="start">▶ START</button>
        <div class="controls-hint" data-i18n="welcomeHint"></div>
    </div>

    <!-- STEP 2: URA-6 -->
    <div id="uraOverlay" class="overlay-screen" style="display: none;">
        <div class="planet-bg"></div>

}

// ================== AUDIO ==================
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playSound(type) {
    if (soundVolume <= 0 || !audioCtx) return;
    try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        let now = audioCtx.currentTime;
        if (type === 'missile') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(260, now);
            osc.frequency.exponentialRampToValueAtTime(90, now + 0.15);
            gain.gain.setValueAtTime(0.07 * soundVolume, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
        } else if (type === 'enemy-laser') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(900, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.12);
            gain.gain.setValueAtTime(0.05 * soundVolume, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        } else if (type === 'pickup') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
            gain.gain.setValueAtTime(0.15 * soundVolume, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
            osc.start(now);
            osc.stop(now + 0.18);
        } else if (type === 'nuke') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(18, now + 1.8);
            gain.gain.setValueAtTime(0.6 * soundVolume, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 1.8);
            osc.start(now);
            osc.stop(now + 1.8);
        } else if (type === 'click') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.08);
            gain.gain.setValueAtTime(0.15 * soundVolume, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'explode-small') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.2);
            gain.gain.setValueAtTime(0.2 * soundVolume, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'flashbang') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
            gain.gain.setValueAtTime(0.3 * soundVolume, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'mega-explode') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(70, now);
            osc.frequency.linearRampToValueAtTime(15, now + 3.0);
            gain.gain.setValueAtTime(0.7 * soundVolume, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 3.0);
            osc.start(now);
            osc.stop(now + 3.0);
        } else if (type === 'firework') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(250 + Math.random() * 300, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
            gain.gain.setValueAtTime(0.25 * soundVolume, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
    } catch(e) {}
}

                document.documentElement.requestFullscreen();

                document.webkitExitFullscreen();

// ================== LEVEL ==================
function checkLevelProgression() {
    if (isVictorySequence) return;

    if (level % 10 === 0 && !boss && aliens.length === 0) {
        spawnBoss();
        return;
    }
    
    if (boss && boss.hp <= 0) {
        if (level === maxLevelSetting) {
            triggerVictorySequence();
            return;
        }

        playSound('flashbang');
        triggerFlash(200);
        createParticles(boss.x + boss.width/2, boss.y + boss.height/2, '#f39c12', 30);
        boss = null;
        score += 300;
        level++;
        currentWave = 1;
        aliensSpawnedInWave = 0;
        aliensToSpawnInWave = waveAlienCount(1);
        applyLevelScaling();
        return;
    }
    
    if (!boss && aliens.length === 0 && aliensSpawnedInWave >= aliensToSpawnInWave) {
        if (currentWave < 3) {
            currentWave++;
            aliensSpawnedInWave = 0;
            aliensToSpawnInWave = waveAlienCount(currentWave);
        } else {
            if (level >= maxLevelSetting) { triggerVictorySequence(); return; }
            level++;
            currentWave = 1;
            aliensSpawnedInWave = 0;
            aliensToSpawnInWave = waveAlienCount(1);
            applyLevelScaling();
        }
    }
}

function applyLevelScaling() {
    currentLaserDamage = baseLaserDamage * Math.pow(1.05, level - 1);
    createParticles(player.x, player.y, '#66fcf1', 25);
    updateUI();
}

function spawnAlien() {
    if (level % 10 === 0 && aliensSpawnedInWave === 0) return;
    if (aliensSpawnedInWave >= aliensToSpawnInWave) return;
    
    let crazyMultiplier = (maxLevelSetting === 200) ? (1 + (level / 40)) : 1.03;
    let alienHp = baseAlienHealth * Math.pow(crazyMultiplier, level - 1);
    let speed = (2 + Math.random() * 1.5 + (level * 0.05)) * ((maxLevelSetting === 200) ? 1.3 : 1.0);

    // Beginner Mode: alien lebih lemah, lebih lambat, tidak menembak
    if (isBeginner()) {
        alienHp *= 0.6;
        speed *= 0.65;
    }
    
    aliens.push({
        x: canvas.width + 40,
        y: Math.random() * (canvas.height - 70) + 20,
        width: 42,
        height: 28,
        speed: speed,
        hp: alienHp,
        maxHp: alienHp,
        shooter: isBeginner() ? false : Math.random() < 0.25,           // kubah merah = menembak
        dropper: Math.random() < (isBeginner() ? 0.25 : 0.15),          // cincin emas = menjatuhkan item
        shootTimer: 60 + Math.random() * 120
    });
    aliensSpawnedInWave++;
}

function spawnBoss() {
    let bossMultiplier = 1 + (level / 10);
    if (maxLevelSetting === 200) bossMultiplier *= 2.5;
    
    let bossHp = baseAlienHealth * 15 * Math.pow(1.05, level - 1) * bossMultiplier;
    boss = {
        x: canvas.width - 130,
        y: canvas.height / 2 - 50,
        width: 95,
        height: 85,
        speed: (1.2 + (level * 0.01)) * ((maxLevelSetting === 200) ? 1.4 : 1.0),
        direction: 1,
        hp: bossHp,
        maxHp: bossHp,
        damage: currentLaserDamage * 2
    };
}

function createParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            radius: Math.random() * 3 + 1,
            color: color,
            life: 25
        });
    }
}

// ================== TEMBAKAN ==================
// Tembakan biasa = rudal mini (2x ukuran laser lama: 36x8)
function shootLaser() {
    let now = Date.now();
    if (now - player.lastShoot > 200) {
        lasers.push({
            x: player.x + player.width - 5,
            y: player.y + player.height / 2 - 4,
            width: 36,
            height: 8,
            speed: 13
        });
        playSound('missile');
        player.lastShoot = now;
    }
}

// Big Bomba: 1 bom nuklir ukuran Tsar Bomba
function fireNuke() {
    bombs.push({
        x: player.x + player.width - 5,
        y: player.y + player.height / 2 - BOMB_H / 2,
        width: BOMB_W,
        height: BOMB_H,
        speed: 8,
        startX: player.x + player.width - 5
    });
    playSound('flashbang');
}

function explodeBomb(b) {
    const cx = b.x + b.width;
    const cy = b.y + b.height / 2;
    const R = BOMB_BLAST_RADIUS;

    explosions.push({ x: cx, y: cy, maxR: R, life: 60, maxLife: 60 });
    playSound('nuke');
    triggerFlash(450);
    createParticles(cx, cy, '#ff9f1a', 70);
    createParticles(cx, cy, '#ffffff', 35);

    // Semua alien dalam radius ledakan hancur
    for (let i = aliens.length - 1; i >= 0; i--) {
        let a = aliens[i];
        let d = Math.hypot(a.x + a.width / 2 - cx, a.y + a.height / 2 - cy);
        if (d <= R) {
            handleAlienDeath(a, 15, true);
            aliens.splice(i, 1);
        }
    }
    // Peluru alien dalam radius ikut hilang
    alienBullets = alienBullets.filter(bl => Math.hypot(bl.x - cx, bl.y - cy) > R);

    // Boss kena 40% darah maksimal kalau dalam radius
    if (boss) {
        let d = Math.hypot(boss.x + boss.width / 2 - cx, boss.y + boss.height / 2 - cy);
        if (d <= R + boss.width / 2) boss.hp -= boss.maxHp * 0.4;
    }
    updateUI();
}

// Kill counter: 25 kill = 1 bom, 15 kill = shield
function addKillEnergy(fromBomb) {
    if (!fromBomb) {
        alienKillCount++;
        if (alienKillCount >= BOMB_KILLS) {
            alienKillCount = 0;
            fireNuke();
        }
    }
    if (!shieldActive) {
        shieldKillCount++;
        if (shieldKillCount >= SHIELD_KILLS) {
            shieldKillCount = 0;
            shieldActive = true;
            shieldEndTime = Date.now() + SHIELD_DURATION;
        }
    }
    updateUI();
}

function handleAlienDeath(a, pts, fromBomb) {
    createParticles(a.x + a.width / 2, a.y + a.height / 2, '#e74c3c', 10);
    playSound('explode-small');
    score += pts;
    addKillEnergy(fromBomb);
    if (a.dropper) spawnDrop(a.x, a.y);
}

// ================== DROP ITEM ==================
// Normal: 55% upgrade (60% boost x5, 40% health), 45% debuff
// Beginner: 80% upgrade, 20% debuff
function spawnDrop(x, y) {
    let type;
    let goodChance = isBeginner() ? 0.80 : 0.55;
    if (Math.random() < goodChance) {
        type = Math.random() < 0.6 ? 'boost' : 'health';
    } else {
        type = 'debuff';
    }
    drops.push({ x: x, y: y, type: type, size: 26, t: Math.random() * 6 });
}

function applyDrop(d) {
    playSound('pickup');
    if (d.type === 'health') {
        player.hp = Math.min(player.maxHp, player.hp + 40);
        createParticles(player.x + 20, player.y + 10, '#2ecc71', 14);
    } else if (d.type === 'boost') {
        buffType = 'up';
        buffEnd = Date.now() + BUFF_DURATION;
        createParticles(player.x + 20, player.y + 10, '#f1c40f', 18);
    } else {
        buffType = 'debuff';
        buffEnd = Date.now() + BUFF_DURATION;
        createParticles(player.x + 20, player.y + 10, '#8e44ad', 18);
    }
    updateUI();
}

// Semua damage ke pemain lewat sini (shield & buff ikut dihitung)
function damagePlayer(raw) {
    if (shieldActive) return;
    player.hp -= raw / buffMult();
    updateUI();
    if (player.hp <= 0) gameOver();
}

// ================== UPDATE ==================
function update() {
    if (!gameActive) return;

    if ((keys['ArrowUp'] || keys['KeyW']) && player.y > 0) player.y -= player.speed;
    if ((keys['ArrowDown'] || keys['KeyS']) && player.y < canvas.height - player.height) player.y += player.speed;

    if (fireMode === 'auto' || keys['Space']) shootLaser();

    if (shieldActive) {
        if (Date.now() >= shieldEndTime) shieldActive = false;
        updateUI();
    }

    if (buffType) {
        if (Date.now() >= buffEnd) buffType = null;
        updateUI();
    }

    if (!isVictorySequence) {
        if (!boss && level % 10 !== 0) {
            spawnTimer++;
            const spawnDelay = isBeginner() ? 95 : Math.max(25, 70 - (level * 0.5));
            if (spawnTimer > spawnDelay) {
                spawnAlien();
                spawnTimer = 0;
            }
        }
        checkLevelProgression();
    }

    // Rudal mini
    for (let i = lasers.length - 1; i >= 0; i--) {
        lasers[i].x += lasers[i].speed;
        if (lasers[i].x > canvas.width) lasers.splice(i, 1);
    }

    // Boss
    if (boss && !isVictorySequence) {
        boss.y += boss.speed * boss.direction;
        if (boss.y <= 10 || boss.y >= canvas.height - boss.height - 10) boss.direction *= -1;

        if (player.x < boss.x + boss.width && player.x + player.width > boss.x &&
            player.y < boss.y + boss.height && player.y + player.height > boss.y) {
            damagePlayer(boss.damage * 0.08);
            createParticles(player.x, player.y, '#e74c3c', 4);
        }

        for (let j = lasers.length - 1; j >= 0; j--) {
            let l = lasers[j];
            if (l.x < boss.x + boss.width && l.x + l.width > boss.x &&
                l.y < boss.y + boss.height && l.y + l.height > boss.y) {
                boss.hp -= currentLaserDamage * buffMult();
                createParticles(l.x, l.y, '#2ecc71', 5);
                lasers.splice(j, 1);
                break;
            }
        }
    }

    // Alien
    if (!isVictorySequence) {
        for (let i = aliens.length - 1; i >= 0; i--) {
            let a = aliens[i];
            if (!a) continue;

            // Alien mati karena splash dibersihkan di sini
            if (a.hp <= 0) {
                handleAlienDeath(a, 10, false);
                aliens.splice(i, 1);
                continue;
            }

            a.x -= a.speed;

            // Alien penembak
            if (a.shooter) {
                a.shootTimer--;
                if (a.shootTimer <= 0 && a.x < canvas.width - 30 && a.x > player.x + 60) {
                    alienBullets.push({
                        x: a.x - 6,
                        y: a.y + a.height / 2 - 2,
                        width: 16,
                        height: 4,
                        speed: 7
                    });
                    playSound('enemy-laser');
                    a.shootTimer = 100 + Math.random() * 100;
                }
            }

            // Tabrakan dengan pemain (Beginner: damage lebih kecil)
            if (player.x < a.x + a.width && player.x + player.width > a.x &&
                player.y < a.y + a.height && player.y + player.height > a.y) {
                damagePlayer(isBeginner() ? 10 : 20);
                createParticles(a.x, a.y, '#e74c3c', 12);
                playSound('explode-small');
                aliens.splice(i, 1);
                continue;
            }

            let removed = false;

            for (let j = lasers.length - 1; j >= 0; j--) {
                let l = lasers[j];
                if (l.x < a.x + a.width && l.x + l.width > a.x &&
                    l.y < a.y + a.height && l.y + l.height > a.y) {
                    
                    a.hp -= currentLaserDamage * buffMult();
                    createParticles(l.x, l.y, '#f39c12', 4);
                    lasers.splice(j, 1);

                    if (a.hp <= 0) {
                        let deadX = a.x;
                        let deadY = a.y;
                        handleAlienDeath(a, 15, false);
                        aliens.splice(i, 1);
                        removed = true;

                        // Splash damage ke alien sekitar (yang mati dibersihkan di awal loop)
                        let splashDamage = a.maxHp * 0.3;
                        aliens.forEach(otherAlien => {
                            let dist = Math.hypot(otherAlien.x - deadX, otherAlien.y - deadY);
                            if (dist < 100) { 
                                otherAlien.hp -= splashDamage;
                                createParticles(otherAlien.x, otherAlien.y, '#e74c3c', 3);
                            }
                        });
                    }
                    break;
                }
            }

            if (removed) continue;
            if (a.x + a.width < 0) aliens.splice(i, 1);
        }
    }

    // Bom nuklir: meledak jauh dari pesawat ATAU saat kena alien/boss
    for (let i = bombs.length - 1; i >= 0; i--) {
        let b = bombs[i];
        b.x += b.speed;
        let hit = false;

        if (b.x - b.startX >= BOMB_RANGE || b.x > canvas.width) {
            hit = true;
        } else {
            for (let k = 0; k < aliens.length; k++) {
                let a = aliens[k];
                if (b.x < a.x + a.width && b.x + b.width > a.x &&
                    b.y < a.y + a.height && b.y + b.height > a.y) { hit = true; break; }
            }
            if (!hit && boss &&
                b.x < boss.x + boss.width && b.x + b.width > boss.x &&
                b.y < boss.y + boss.height && b.y + b.height > boss.y) hit = true;
        }

        if (hit) {
            bombs.splice(i, 1);
            explodeBomb(b);
        }
    }

    // Efek ledakan
    for (let i = explosions.length - 1; i >= 0; i--) {
        explosions[i].life--;
        if (explosions[i].life <= 0) explosions.splice(i, 1);
    }

    // Peluru alien (-15 HP)
    for (let i = alienBullets.length - 1; i >= 0; i--) {
        let bl = alienBullets[i];
        bl.x -= bl.speed;
        if (bl.x + bl.width < 0) { alienBullets.splice(i, 1); continue; }
        if (bl.x < player.x + player.width && bl.x + bl.width > player.x &&
            bl.y < player.y + player.height && bl.y + bl.height > player.y) {
            alienBullets.splice(i, 1);
            createParticles(player.x + 10, bl.y, '#ff4d6d', 8);
            damagePlayer(15);
        }
    }

    // Item drop
    for (let i = drops.length - 1; i >= 0; i--) {
        let d = drops[i];
        d.x -= 2;
        d.t += 0.1;
        if (d.x + d.size < 0) { drops.splice(i, 1); continue; }
        if (player.x < d.x + d.size && player.x + player.width > d.x &&
            player.y < d.y + d.size && player.y + player.height > d.y) {
            drops.splice(i, 1);
            applyDrop(d);
        }
    }

    // FISIKA BADAN ANTARIKSA & BLACKHOLE (KIRI ATAS: X 60, Y 60)
    let bhX = 60;
    let bhY = 60;

    spaceAgencies.forEach(sa => {
        let distToBh = Math.hypot(sa.x - bhX, sa.y - bhY);
        
        if (distToBh < 120) {
            let angleToBh = Math.atan2(bhY - sa.y, bhX - sa.x);
            sa.vx += Math.cos(angleToBh) * 0.35;
            sa.vy += Math.sin(angleToBh) * 0.35;
            
            if (distToBh < 25) {
                sa.x = canvas.width / 2 + (Math.random() - 0.5) * 180;
                sa.y = canvas.height + 20;
                sa.vx = (Math.random() - 0.5) * 1.5;
                sa.vy = - (0.8 + Math.random() * 0.8);
            }
        } else {
            sa.x += sa.vx;
            sa.y += sa.vy;

            if (sa.x < 20 || sa.x > canvas.width - 120) sa.vx *= -1;
            if (sa.y < 20 || sa.y > canvas.height - 20) sa.vy *= -1;

            if (Math.abs(sa.vx) < 0.3) sa.vx = (Math.random() - 0.5) * 1.2;
            if (Math.abs(sa.vy) < 0.3) sa.vy = (Math.random() - 0.5) * 1.2;
        }
    });

    backgroundMoons.forEach(bm => {
        bm.x += bm.speedX;
        bm.y += bm.speedY;
        if(bm.x < 0 || bm.x > canvas.width) bm.speedX *= -1;
        if(bm.y < 0 || bm.y > canvas.height) bm.speedY *= -1;
    });

    deadUfos.forEach(u => {
        u.x += u.vx; u.y += u.vy;
        u.angle += 0.02;
        if(u.x < 0 || u.x > canvas.width) u.vx *= -1;
        if(u.y < 0 || u.y > canvas.height) u.vy *= -1;
    });

    dancingMoons.forEach(m => {
        m.angle += 0.05;
        m.y = m.baseY + Math.sin(m.angle) * 15;
    });

    for (let i = fireworks.length - 1; i >= 0; i--) {
        fireworks[i].life--;
        if (fireworks[i].life <= 0) fireworks.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// ================== GAMBAR ==================
function drawDrop(d) {
    let cy = d.y + Math.sin(d.t) * 4;
    let cx = d.x + d.size / 2;
    let r = d.size / 2;
    let color, label;
    if (d.type === 'boost') { color = '#f1c40f'; label = '×5'; }
    else if (d.type === 'health') { color = '#2ecc71'; label = '+'; }
    else { color = '#8e44ad'; label = '-25'; }

    ctx.save();
    ctx.shadowBlur = 14;
    ctx.shadowColor = color;
    ctx.fillStyle = '#0b0c10';
    ctx.beginPath();
    ctx.arc(cx, cy + r, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = color;
    ctx.font = 'bold 12px "Courier Prime", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, cx, cy + r);
    ctx.restore();
}

// ===== PESAWAT PEMAIN (jet tempur dengan sayap, kokpit & mesin kembar) =====
function drawPlayerShip() {
    const t = Date.now();
    ctx.save();
    ctx.translate(player.x, player.y);   // badan 50 x 32, garis tengah di y = 16

    // Api mesin kembar
    const flick = 10 + Math.random() * 9;
    [10, 22].forEach(fy => {
        const g = ctx.createLinearGradient(4, fy, -flick, fy);
        g.addColorStop(0, 'rgba(255,255,255,0.95)');
        g.addColorStop(0.35, 'rgba(255,190,60,0.9)');
        g.addColorStop(1, 'rgba(255,80,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(4, fy - 3);
        ctx.lineTo(-flick, fy);
        ctx.lineTo(4, fy + 3);
        ctx.closePath();
        ctx.fill();
    });

    // Sayap atas & bawah (menyapu ke belakang)
    const wingG = ctx.createLinearGradient(6, 0, 34, 0);
    wingG.addColorStop(0, '#1b2a41');
    wingG.addColorStop(1, '#4a6fa5');
    ctx.fillStyle = wingG;
    ctx.strokeStyle = '#66fcf1';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(34, 12); ctx.lineTo(16, -4); ctx.lineTo(7, -4); ctx.lineTo(15, 12);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(34, 20); ctx.lineTo(16, 36); ctx.lineTo(7, 36); ctx.lineTo(15, 20);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Garis aksen di sayap
    ctx.strokeStyle = '#f39c12';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(26, 11); ctx.lineTo(14, -1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(26, 21); ctx.lineTo(14, 33); ctx.stroke();

    // Nozzle mesin
    ctx.fillStyle = '#2b2f36';
    ctx.fillRect(1, 8, 6, 5);
    ctx.fillRect(1, 19, 6, 5);

    // Badan utama (fuselage) + glow
    const bodyG = ctx.createLinearGradient(4, 0, 50, 0);
    bodyG.addColorStop(0, '#16606a');
    bodyG.addColorStop(0.5, '#45a29e');
    bodyG.addColorStop(1, '#d6fffc');
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#66fcf1';
    ctx.fillStyle = bodyG;
    ctx.strokeStyle = '#baffff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(50, 16);
    ctx.quadraticCurveTo(40, 9, 22, 9);
    ctx.lineTo(6, 11);
    ctx.lineTo(4, 13);
    ctx.lineTo(4, 19);
    ctx.lineTo(6, 21);
    ctx.lineTo(22, 23);
    ctx.quadraticCurveTo(40, 23, 50, 16);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;

    // Garis tengah badan
    ctx.strokeStyle = 'rgba(11,12,16,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(8, 16); ctx.lineTo(22, 16); ctx.stroke();

    // Kokpit kaca
    const cockG = ctx.createLinearGradient(0, 12, 0, 20);
    cockG.addColorStop(0, '#d9fcff');
    cockG.addColorStop(1, '#0a3d5a');
    ctx.fillStyle = cockG;
    ctx.beginPath();
    ctx.ellipse(31, 16, 8, 3.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0b0c10';
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath();
    ctx.ellipse(33, 14.8, 3.5, 1, 0, 0, Math.PI * 2);
    ctx.fill();

    // Lampu ujung sayap berkedip (merah / hijau)
    if (Math.floor(t / 300) % 2 === 0) {
        ctx.fillStyle = '#ff4d4d';
        ctx.shadowColor = '#ff4d4d';
        ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(9, -3, 2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#4dff88';
        ctx.shadowColor = '#4dff88';
        ctx.beginPath(); ctx.arc(9, 35, 2, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#c5c6c7";
    stars.forEach(s => {
        s.x -= s.speed;
        if (s.x < 0) s.x = canvas.width;
        ctx.globalAlpha = Math.sin(Date.now() * 0.002 + s.x) * 0.4 + 0.5;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });
    ctx.globalAlpha = 1.0;

    spaceAgencies.forEach(sa => {
        ctx.save();
        ctx.font = '13px "Courier Prime", Courier, monospace';
        ctx.fillStyle = sa.color;
        ctx.shadowBlur = 5;
        ctx.shadowColor = sa.color;
        ctx.fillText(sa.name, sa.x, sa.y);
        ctx.restore();
    });

    backgroundMoons.forEach(bm => {
        ctx.save();
        ctx.fillStyle = '#45a29e';
        ctx.beginPath();
        ctx.arc(bm.x, bm.y, bm.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#1f2833';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#c5c6c7';
        ctx.font = '11px "Courier Prime", Courier, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(bm.name, bm.x, bm.y + bm.radius + 12);
        ctx.restore();
    });

    deadUfos.forEach(u => {
        ctx.save();
        ctx.translate(u.x, u.y);
        ctx.rotate(u.angle);
        ctx.fillStyle = '#1f2833';
        ctx.beginPath();
        ctx.ellipse(0, 0, 20, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#45a29e';
        ctx.beginPath();
        ctx.arc(0, -4, 8, Math.PI, 0, false);
        ctx.fill();
        ctx.restore();
    });

    fireworks.forEach(f => {
        ctx.save();
        ctx.strokeStyle = f.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(f.x, f.y, (30 - f.life) * 2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    });

    dancingMoons.forEach(m => {
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.fillStyle = '#c5c6c7';
        ctx.beginPath();
        ctx.arc(0, 0, m.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#66fcf1';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#0b0c10';
        ctx.fillRect(-8, -6, 4, 6);
        ctx.fillRect(4, -6, 4, 6);
        ctx.beginPath();
        ctx.arc(0, 4, 6, 0, Math.PI, false);
        ctx.stroke();

        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(m.emoji, 0, -m.radius - 8);

        ctx.fillStyle = '#66fcf1';
        ctx.font = '12px "Courier Prime", Courier, monospace';
        ctx.fillText(m.name, 0, m.radius + 14);
        ctx.restore();
    });

    // Item drop
    drops.forEach(drawDrop);

    // Pesawat pemain
    drawPlayerShip();

    // Aura buff / debuff
    if (buffType) {
        ctx.save();
        ctx.strokeStyle = buffType === 'up' ? '#f1c40f' : '#8e44ad';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 12;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.globalAlpha = 0.6 + Math.sin(Date.now() * 0.01) * 0.3;
        ctx.beginPath();
        ctx.arc(player.x + player.width / 2, player.y + player.height / 2, 30, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    // Bubble shield
    if (shieldActive) {
        let left = shieldEndTime - Date.now();
        ctx.save();
        ctx.strokeStyle = '#5dade2';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#5dade2';
        ctx.globalAlpha = left < 2000 ? (Math.floor(Date.now() / 150) % 2 ? 0.3 : 0.9) : 0.9;
        ctx.beginPath();
        ctx.arc(player.x + player.width / 2, player.y + player.height / 2, 38, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    // Rudal mini
    lasers.forEach(l => {
        ctx.save();
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ff7043';
        // api
        ctx.fillStyle = '#f39c12';
        ctx.beginPath();
        ctx.moveTo(l.x, l.y + 1);
        ctx.lineTo(l.x - 8 - Math.random() * 4, l.y + l.height / 2);
        ctx.lineTo(l.x, l.y + l.height - 1);
        ctx.closePath();
        ctx.fill();
        // badan
        ctx.fillStyle = '#d5d8dc';
        ctx.fillRect(l.x, l.y + 1, l.width - 8, l.height - 2);
        // hidung
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.moveTo(l.x + l.width - 8, l.y);
        ctx.lineTo(l.x + l.width, l.y + l.height / 2);
        ctx.lineTo(l.x + l.width - 8, l.y + l.height);
        ctx.closePath();
        ctx.fill();
        // sirip
        ctx.fillStyle = '#7f8c8d';
        ctx.fillRect(l.x, l.y - 2, 7, 2);
        ctx.fillRect(l.x, l.y + l.height, 7, 2);
        ctx.restore();
    });

    // Bom nuklir (Tsar Bomba)
    bombs.forEach(b => {
        ctx.save();
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#ffb347';
        // api belakang
        ctx.fillStyle = '#f39c12';
        ctx.beginPath();
        ctx.moveTo(b.x, b.y + 4);
        ctx.lineTo(b.x - 16 - Math.random() * 8, b.y + b.height / 2);
        ctx.lineTo(b.x, b.y + b.height - 4);
        ctx.closePath();
        ctx.fill();
        // sirip ekor
        ctx.fillStyle = '#7f8c8d';
        ctx.beginPath();
        ctx.moveTo(b.x, b.y - 6);
        ctx.lineTo(b.x + 18, b.y + 2);
        ctx.lineTo(b.x + 18, b.y + b.height - 2);
        ctx.lineTo(b.x, b.y + b.height + 6);
        ctx.closePath();
        ctx.fill();
        // badan
        ctx.fillStyle = '#ecf0f1';
        ctx.beginPath();
        ctx.ellipse(b.x + b.width * 0.55, b.y + b.height / 2, b.width * 0.45, b.height / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        // garis merah & kuning
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(b.x + b.width * 0.42, b.y + 2, 7, b.height - 4);
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(b.x + b.width * 0.62, b.y + 3, 5, b.height - 6);
        ctx.restore();
    });

    // Peluru alien
    alienBullets.forEach(bl => {
        ctx.save();
        ctx.fillStyle = '#ff4d6d';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff4d6d';
        ctx.fillRect(bl.x, bl.y, bl.width, bl.height);
        ctx.restore();
    });

    // Alien
    aliens.forEach(a => {
        ctx.fillStyle = '#1f2833';
        ctx.beginPath();
        ctx.ellipse(a.x + a.width/2, a.y + a.height/2, a.width/2, a.height/3, 0, 0, Math.PI * 2);
        ctx.fill();

        // Kubah: merah = penembak, cyan = biasa
        ctx.fillStyle = a.shooter ? '#e74c3c' : '#66fcf1';
        ctx.beginPath();
        ctx.arc(a.x + a.width/2, a.y + a.height/3, a.width/4, Math.PI, 0, false);
        ctx.fill();

        // Cincin emas = menjatuhkan item
        if (a.dropper) {
            ctx.save();
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10 + Math.sin(Date.now() * 0.008) * 5;
            ctx.shadowColor = '#f1c40f';
            ctx.beginPath();
            ctx.ellipse(a.x + a.width/2, a.y + a.height/2, a.width/2 + 4, a.height/3 + 4, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        let hpPct = Math.max(0, a.hp / a.maxHp);
        ctx.fillStyle = '#78281f';
        ctx.fillRect(a.x, a.y - 8, a.width, 4);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(a.x, a.y - 8, a.width * hpPct, 4);
    });

    if (boss) {
        ctx.fillStyle = '#78281f';
        ctx.beginPath();
        ctx.ellipse(boss.x + boss.width/2, boss.y + boss.height/2, boss.width/2, boss.height/3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f39c12';
        ctx.beginPath();
        ctx.arc(boss.x + boss.width/2, boss.y + boss.height/3, boss.width/3, Math.PI, 0, false);
        ctx.fill();

        let bossHpPct = Math.max(0, boss.hp / boss.maxHp);
        ctx.fillStyle = '#78281f';
        ctx.fillRect(boss.x, boss.y - 14, boss.width, 8);
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(boss.x, boss.y - 14, boss.width * bossHpPct, 8);
        ctx.strokeStyle = '#c5c6c7';
        ctx.strokeRect(boss.x, boss.y - 14, boss.width, 8);
    }

    // Ledakan nuklir (luas + 2 cincin gelombang kejut)
    explosions.forEach(e => {
        let p = 1 - e.life / e.maxLife;
        let r = Math.max(1, e.maxR * Math.min(1, p * 1.6));
        ctx.save();
        ctx.globalAlpha = Math.max(0, e.life / e.maxLife);
        let g = ctx.createRadialGradient(e.x, e.y, r * 0.1, e.x, e.y, r);
        g.addColorStop(0, 'rgba(255,255,255,0.95)');
        g.addColorStop(0.4, 'rgba(255,170,40,0.8)');
        g.addColorStop(1, 'rgba(200,40,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffd27f';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(e.x, e.y, r * 0.65, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    });

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
    });
}

function gameLoop() {
    if (!gameActive) return;
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// ===== MENU MUSIC: ORIGINAL WESTERN DUEL THEME =====
(function () {
    const BPM = 88;                       // ubah angka ini buat ganti kecepatan
    const STEP = 60 / BPM / 4;            // 1 step = nada 1/16
    const TOTAL = 128;                    // 8 bar x 16 step
    const MENU_IDS = ['welcomeOverlay','uraOverlay','warningOverlay','configOverlay','guideOverlay','modeOverlay'];
    const m2f = m => 440 * Math.pow(2, (m - 69) / 12);

    // Melodi gitar: [mulai(1/8), nada MIDI, durasi(1/8)]
    const LEAD = [
        [0,64,4],[4,67,2],[6,71,2],
        [8,69,6],[14,67,2],
        [16,67,4],[20,64,2],[22,60,2],
        [24,62,4],[28,66,2],[30,69,2],
        [32,71,4],[36,74,2],[38,76,2],
        [40,72,6],[46,71,2],
        [48,69,2],[50,66,2],[52,63,4],
        [56,64,8]
    ];
    const BASS = [40, 40, 48, 50, 40, 45, 47, 40];   // Em Em C D Em Am B Em
    const leadAt = {};
    LEAD.forEach(([s, m, d]) => { leadAt[s * 2] = [m, d * 2]; });

    let muted = false, step = 0, nextTime = 0, wasPlaying = false;
    let master = null, echoIn = null, noiseBuf = null;

    function build() {
        if (master || !audioCtx) return;
        master = audioCtx.createGain();
        master.gain.value = 0;
        master.connect(audioCtx.destination);
        const delay = audioCtx.createDelay(1.0);
        delay.delayTime.value = 0.34;
        const fb = audioCtx.createGain(); fb.gain.value = 0.38;
        const wet = audioCtx.createGain(); wet.gain.value = 0.35;
        echoIn = audioCtx.createGain();
        echoIn.connect(delay); delay.connect(fb); fb.connect(delay);
        delay.connect(wet); wet.connect(master);
        const len = audioCtx.sampleRate;
        noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }

    function twang(t, midi, dur, vel) {
        const f = m2f(midi);
        const o = audioCtx.createOscillator(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(f * 0.94, t);
        o.frequency.exponentialRampToValueAtTime(f, t + 0.07);
        const lfo = audioCtx.createOscillator(); lfo.frequency.value = 5.5;
        const lg = audioCtx.createGain(); lg.gain.value = f * 0.006;
        lfo.connect(lg); lg.connect(o.frequency);
        const flt = audioCtx.createBiquadFilter(); flt.type = 'lowpass'; flt.Q.value = 3;
        flt.frequency.setValueAtTime(3200, t);
        flt.frequency.exponentialRampToValueAtTime(900, t + Math.max(0.2, dur));
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vel, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.3);
        o.connect(flt); flt.connect(g); g.connect(master); g.connect(echoIn);
        o.start(t); lfo.start(t); o.stop(t + dur + 0.35); lfo.stop(t + dur + 0.35);
    }

    function whistle(t, midi, dur, vel) {
        const f = m2f(midi);
        const o = audioCtx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
        const lfo = audioCtx.createOscillator(); lfo.frequency.value = 6;
        const lg = audioCtx.createGain(); lg.gain.value = f * 0.012;
        lfo.connect(lg); lg.connect(o.frequency);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vel, t + 0.08);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.15);
        o.connect(g); g.connect(master); g.connect(echoIn);
        o.start(t); lfo.start(t); o.stop(t + dur + 0.2); lfo.stop(t + dur + 0.2);
    }

    function pluck(t, midi, dur, vel) {
        const o = audioCtx.createOscillator(); o.type = 'triangle'; o.frequency.value = m2f(midi);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vel, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.12);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + dur + 0.15);
    }

    function tom(t, vel) {
        const o = audioCtx.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(130, t);
        o.frequency.exponentialRampToValueAtTime(45, t + 0.18);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(vel, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + 0.25);
    }

    function noiseHit(t, type, freq, q, dur, vel) {
        const s = audioCtx.createBufferSource(); s.buffer = noiseBuf;
        const f = audioCtx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(vel, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(master);
        s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
    }

    function playStep(s, t) {
        const bar = s >> 4, p = s & 15, beatPos = p & 3;
        const root = BASS[bar];
        // Ritme kuda gallop: panjang-pendek-pendek
        if (beatPos === 0) pluck(t, root, STEP * 2, 0.5);
        if (beatPos === 2 || beatPos === 3) pluck(t, root, STEP, 0.3);
        if (beatPos === 0 || beatPos === 2 || beatPos === 3) noiseHit(t, 'bandpass', 1200, 6, 0.05, beatPos === 0 ? 0.14 : 0.08);
        if (p === 0 || p === 8) tom(t, 0.45);
        if (p === 4 || p === 12) noiseHit(t, 'highpass', 2000, 0.7, 0.12, 0.12);
        const n = leadAt[s];
        if (n) {
            twang(t, n[0], n[1] * STEP, 0.4);
            if (bar >= 4) whistle(t, n[0] + 12, n[1] * STEP, 0.07);
        }
    }

    function tick() {
        const inMenu = MENU_IDS.some(id => {
            const e = document.getElementById(id);
            return e && e.style.display !== 'none';
        });
        const btn = document.getElementById('music-btn');
        if (btn) btn.style.display = inMenu ? 'flex' : 'none';
        if (!audioCtx) return;
        build();
        if (!master) return;
        const should = inMenu && !muted && audioCtx.state === 'running' && soundVolume > 0;
        master.gain.setTargetAtTime(should ? 0.55 * soundVolume : 0, audioCtx.currentTime, 0.25);
        if (!should) { wasPlaying = false; return; }
        if (!wasPlaying || nextTime < audioCtx.currentTime - 0.5) {
            wasPlaying = true;
            nextTime = audioCtx.currentTime + 0.1;
        }
        while (nextTime < audioCtx.currentTime + 0.3) {
            playStep(step, nextTime);
            nextTime += STEP;
            step = (step + 1) % TOTAL;
        }
    }

    // Tombol mute musik (muncul cuma di menu)
    const b = document.createElement('button');
    b.id = 'music-btn';
    b.textContent = '🎵';
    b.style.cssText = 'position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:1000;width:40px;height:40px;border-radius:50%;background:rgba(31,40,51,0.85);border:1px solid #66fcf1;font-size:18px;display:none;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;';
    b.addEventListener('click', () => { muted = !muted; b.textContent = muted ? '🔇' : '🎵'; });
    document.body.appendChild(b);

    // Browser butuh 1x sentuhan sebelum audio boleh bunyi
    ['pointerdown', 'touchstart', 'click'].forEach(ev =>
        document.addEventListener(ev, () => initAudio(), { passive: true })
    );

    setInterval(tick, 60);
})();
